<!-- ADD THIS CSS -->
<style>
  .slider {
    position: relative;
    width: 100%;
  }

  .slide {
    display: none;
    width: 100%;
    height: 50vh;
    object-fit: cover;
    border-radius: 12px;
    border: 4px solid #28a745;
    box-sizing: border-box;
  }

  .slide.active {
    display: block;
  }

  .prev,
  .next {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(0,0,0,0.5);
    color: white;
    border: none;
    padding: 12px 16px;
    cursor: pointer;
    font-size: 24px;
    border-radius: 50%;
  }

  .prev {
    left: 10px;
  }

  .next {
    right: 10px;
  }
</style>

<!-- ADD THIS SCRIPT -->
<script>
  // Store slide indexes and timers for each slider
  const sliders = document.querySelectorAll('.slider');

  sliders.forEach((slider) => {
    slider.dataset.index = 0;

    // Start auto sliding
    startAutoSlide(slider);
  });

  function showSlide(slider, index) {
    const slides = slider.querySelectorAll('.slide');

    // Remove active class from all slides
    slides.forEach(slide => slide.classList.remove('active'));

    // Loop slides
    if (index < 0) {
      index = slides.length - 1;
    }

    if (index >= slides.length) {
      index = 0;
    }

    // Show current slide
    slides[index].classList.add('active');

    // Save current index
    slider.dataset.index = index;
  }

  function changeSlide(button, direction) {
    const slider = button.parentElement;

    let currentIndex = parseInt(slider.dataset.index);

    currentIndex += direction;

    showSlide(slider, currentIndex);

    // Restart auto slide after manual click
    clearInterval(slider.autoSlide);
    startAutoSlide(slider);
  }

  function startAutoSlide(slider) {
    slider.autoSlide = setInterval(() => {
      let currentIndex = parseInt(slider.dataset.index);
      showSlide(slider, currentIndex + 1);
    }, 1500); // 1500ms = 1.5 seconds
  }
</script>

<!-- RANDOM MOVING GIF -->
<div class="floating-gif" id="floatingGif">

  <div class="speech-bubble" id="speechBubble">Click me.</div>

<style>
  /* FLOATING GIF */
  .floating-gif {
    position: fixed;
    top: 100px;
    left: 100px;
    z-index: 9999;
    transition:
      top 2s ease,
      left 2s ease;
    pointer-events: none;
  }

  .floating-gif img {
    width: 200px;
    height: auto;
    animation: floatBounce 2s infinite ease-in-out;
  }

  /* SPEECH BUBBLE */
  .speech-bubble {
    position: absolute;
    top: -60px;
    left: 50%;
    transform: translateX(-50%);
    background: white;
    color: black;
    padding: 10px 16px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: bold;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    white-space: nowrap;
  }

  .speech-bubble::after {
    content: "";
    position: absolute;
    bottom: -10px;
    left: 50%;
    transform: translateX(-50%);
    border-width: 10px 10px 0;
    border-style: solid;
    border-color: white transparent transparent transparent;
  }

  /* FLOATING EFFECT */
  @keyframes floatBounce {
    0%   { transform: translateY(0px); }
    50%  { transform: translateY(-10px); }
    100% { transform: translateY(0px); }
  }

  /* MOBILE */
  @media (max-width: 600px) {
    .floating-gif img {
      width: 80px;
    }

    .speech-bubble {
      font-size: 12px;
      padding: 7px 12px;
      top: -45px;
    }
  }
</style>

<script>
  const floatingGif = document.getElementById("floatingGif");
  const speechBubble = document.getElementById("speechBubble");

  function moveGifRandomly() {

    // RANDOM POSITION
    const maxX = window.innerWidth - 180;
    const maxY = window.innerHeight - 180;

    const randomX = Math.floor(Math.random() * maxX);
    const randomY = Math.floor(Math.random() * maxY);

    floatingGif.style.left = randomX + "px";
    floatingGif.style.top = randomY + "px";
  }

  // MOVE EVERY 5 SECONDS
  setInterval(moveGifRandomly, 5000);

  // INITIAL MOVE
  moveGifRandomly();
</script>
